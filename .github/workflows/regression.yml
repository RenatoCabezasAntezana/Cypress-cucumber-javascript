name: Regression Testing DemoQA

on:
  push:
    branches:
      - '**'
  repository_dispatch:
    types: [run-cypress-tests] 

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1

      - name: Install dependencies
        run: npm i

      - name: Cypress.io
        uses: cypress-io/github-action@v6.5.0
        with:
          # Se usará el comando que definiste para ejecutar por tags
          command: npm run cypress:execution-tags
          browser: chrome
          record: true

      # --- AQUÍ AGREGASTE EL PASO DE IMPORTACIÓN ---
      - name: Import Results to Xray
        if: always()
        uses: mikepenz/xray-action@v3
        with:
          username: ${{ secrets.XRAY_CLIENT_ID }}
          password: ${{ secrets.XRAY_CLIENT_SECRET }}
          testFormat: 'cucumber'
          testPaths: 'cypress/reports/cucumber-results.json'
          projectKey: 'SB'
          # Nota el nombre corregido: testExecKey
          testExecKey: ${{ github.event.client_payload.test_execution_key }}

      - name: Download a Build Artifact
        uses: actions/download-artifact@v4.1.5

      - name: Upload Cypress Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos/**/*.mp4