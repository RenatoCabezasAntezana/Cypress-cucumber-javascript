name: Cypress Xray CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      testPlanKey:
        description: 'ID del Test Plan (ej. SB-10)'
        required: false # Cambiado a false para que el push automático no falle
        type: string
      projectKey:
        description: 'ID del Proyecto (ej. SB)'
        required: false
        type: string
  repository_dispatch:
    types: [run-cypress-tests]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run Cypress Regression Tests
        continue-on-error: true
        run: |
          npx cypress run \
          --browser chrome \
          --headless \
          --env tags=@regression \
          --spec "cypress/e2e/**/*.feature" \
          --reporter cypress-junit-reporter \
          --reporter-options "mochaFile=cypress/results/results-[hash].xml"

      - name: "Import results to Xray"
        if: always()
        uses: mikepenz/xray-action@v2.3.0
        with:
          username: ${{ secrets.XRAY_CLIENT_ID }}
          password: ${{ secrets.XRAY_CLIENT_SECRET }}
          xrayCloud: "true"
          testFormat: "junit"
          # Buscamos en la carpeta definida en el comando anterior
          testPaths: "cypress/results/*.xml" 
          # Prioriza el input manual, si no, usa el secret
          testPlanKey: "${{ github.event.inputs.testPlanKey || secrets.TESTPLANKEY }}"
          projectKey: "${{ github.event.inputs.projectKey || secrets.PROJECTKEY }}"

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-execution-evidence
          path: |
            cypress/results/
            cypress/videos/
            cypress/screenshots/
